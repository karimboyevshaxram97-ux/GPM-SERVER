version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gmp-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: gmp-dev
    volumes:
      - mongodb_data:/data/db
    networks:
      - gmp-network
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh -u admin -p password --authenticationDatabase admin localhost:27017/gmp-dev
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gmp-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gmp-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: gmp-mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gmp-network

volumes:
  mongodb_data:
  redis_data:

networks:
  gmp-network:
    driver: bridge
